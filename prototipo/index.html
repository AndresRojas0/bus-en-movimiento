<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo — Corredores en movimiento (Inspectores RB)</title>
<style>
  @import url(https://db.onlinewebfonts.com/c/13f36ef31999f27c57a09d26bc9b6563?family=Helvetica+Neue+LT+Com+77+Bold+Condensed+V1);
  :root { --ink:#2c2e3e; --paper:#f4f4f6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Helvetica Neue LT Com 77 Bold Condensed V1', Helvetica, Arial, sans-serif; background:var(--paper); color:var(--ink); }
  header { background:var(--ink); color:#fff; padding:10px 16px; }
  header h1 { font-size:15px; margin:0 0 2px; }
  header .sub { font-size:11px; opacity:.75; }
  .legend { display:flex; gap:16px; font-size:11px; margin-top:6px; flex-wrap:wrap; }
  .legend b { font-weight:700; }
  .watermark { font-size:10px; color:#ffb84d; font-weight:700; }
  #selector { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  #selector .chip { background:#3a3d52; color:#fff; border-radius:14px; padding:3px 10px; cursor:pointer; user-select:none; font-size:11px; }
  #selector .chip.on { background:#fff; color:var(--ink); font-weight:700; }
  #selector .chip.off { opacity:.6; }
  #layout { display:flex; min-height:calc(100vh - 96px); }
  #stage { flex:1; overflow:auto; }
  #svg { display:block; margin:8px auto; background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  #calSel { display:flex; flex-direction:column; gap:4px; align-items:center; margin-top:2px; }
  #calSel .cal { width:52px; text-align:center; font-size:9px; padding:3px 2px; border-radius:8px; background:#ececec; color:#555; cursor:pointer; user-select:none; box-sizing:border-box; }
  #calSel .cal.on { background:var(--ink); color:#fff; font-weight:700; }
  #timebar { position:sticky; top:0; align-self:center; width:60px; max-width:60px; box-sizing:border-box; height:100vh; background:#fff; border-left:1px solid #ddd; display:flex; flex-direction:column; align-items:center; padding:10px 3px; gap:8px; z-index:8; }
  #clockSmall { font-size:9px; color:#999; text-align:center; line-height:1.4; }
  button { border:none; background:var(--ink); color:#fff; border-radius:8px; padding:8px 10px; font-weight:700; cursor:pointer; }
  .vslider { position:relative; width:54px; height:min(100vh,460px); background:linear-gradient(#e8e8ec,#efeff2); border-radius:27px; flex-shrink:0; overflow:hidden; touch-action:none; cursor:grab; }
  /* T36: tira de horas que fluye por detrás del botón-hora (futuro nace abajo, el pasado
     sale arriba); arrastrable (arriba = avanzar). El botón queda fijo en el centro. */
  #tira { position:absolute; inset:0; }
  #tira .hh { position:absolute; left:0; right:0; text-align:center; font-size:10px; color:#555; font-weight:700; width:100%; cursor:default; }
  #tira .hh span { display:block; width:14px; height:2px; background:#8a90a3; margin:0 auto 2px; }
  .vslider .fade { position:absolute; left:0; right:0; top:0; height:52px; pointer-events:none; z-index:1;
                   background:linear-gradient(#e8e8ec, rgba(232,232,236,0)); }
  .vslider .fade.bb { top:auto; bottom:0; background:linear-gradient(rgba(232,232,236,0), #e8e8ec); }
  #btnHora { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2;
             min-width:44px; padding:4px 5px; border:none; border-radius:10px; background:var(--ink);
             color:#fff; font-weight:700; font-size:11px; letter-spacing:.3px; font-family:inherit;
             box-shadow:0 2px 8px rgba(0,0,0,.4); cursor:pointer; user-select:none; white-space:nowrap; }
  #btnHora.pausa { background:#7a7f8e; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .hint { font-size:9px; color:#888; text-align:center; line-height:1.45; }
  #panel { position:fixed; right:72px; top:64px; max-width:280px; background:#fff; border:1px solid #ddd; border-radius:10px; padding:10px 12px; font-size:16px; display:none; box-shadow:0 4px 14px rgba(0,0,0,.18); z-index:9; max-height:60vh; overflow:auto; }
  #panel h3 { position:sticky; top:0; margin:-10px -12px 6px; padding:7px 12px 5px; font-size:16px; background:#fff;
              border-bottom:1px solid #eee; z-index:1; cursor:move; user-select:none; touch-action:none; }   /* header pegado al scroll: h3 + ✕ siempre visibles; manija de arrastre (touch-action:none: el toque sobre ella no scrollea la página) */
  #panel.drag-grab { box-shadow:0 10px 28px rgba(0,0,0,.28); }   /* feedback: panel agarrado en pleno drag */
  #panel table { border-collapse:collapse; width:100%; }
  #panel td { padding:1px 6px 1px 0; }
  #panel td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  #panel tr.segh td { background:#f2f3f8; font-weight:700; color:#333; padding:3px 6px 3px 0; margin-top:2px; }
  #panel tr.pas td { color:#b8b8b8; }
  #panel tr.prox td { color:#b02a37; font-weight:700; }
  #panel tr.fut td { color:#111; }
  #panel .x { float:right; cursor:pointer; font-size:13px; color:#999; font-weight:700; }
  #panel .x:hover { color:#333; }
  #panel .km { color:#777; font-size:10px; margin:2px 0 4px; }
  #panel .cDot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  #panel table.secc tr td:nth-child(2) { color:#555; white-space:nowrap; }
  #panel table.secc tr td:last-child { width:38px; }
  circle.dot { cursor:pointer; }
  @media (max-width:720px) { #panel { right:8px; top:8px; } }
</style>
</head>
<body>
<header>
  <h1>Eje por corredor físico (ida ⇄ vuelta, mismo eje)</h1>
  <div class="sub"> </div>
  <div class="legend">
    <span><b>● izquierda:</b> ida, desciende </span>
    <span><b>● derecha:</b> vuelta, asciende </span>
    <span class="watermark">⚠ PROTOTIPO</span>
  </div>
  <div id="selector"></div>
  <div style="margin-top:8px; display:flex; gap:10px; align-items:center">
    <a id="lblReal" style="font-size:11px; color:#9ff; cursor:pointer; text-decoration:underline">⬆ cargar horarios-reales.json (opcional)</a>
    <span id="msgReal" style="font-size:10px; color:#ffe08a"></span>
    <input id="fileReal" type="file" accept=".json,application/json" style="display:none">
  </div>
</header>

<div id="layout">
  <div id="stage"><svg id="svg"></svg></div>
  <div id="timebar">
    <div id="clockSmall">tiempo de la simulación<br>(HH:MM:SS)</div>
    <div id="slider" class="vslider">
      <div id="tira"></div>
      <div class="fade"></div><div class="fade bb"></div>
      <button id="btnHora" title="1 toque: pausa/reanudar · 2 toques: volver a la hora real del reloj">08:00:00</button>
    </div>
    <div id="calSel">
      <div class="cal" data-cal="habiles">Hábil</div>
      <div class="cal" data-cal="mediofestivo">Medfest</div>
      <div class="cal" data-cal="festivo">Fest</div>
    </div>
    <div class="hint">tira: arrastrá<br>(↑ avanza) · botón:<br>1 toque pausa,<br>2 toques hora real</div>
  </div>
</div>
<div id="panel"></div>

<script>
'use strict';
/* ------------------------------------------------------------------ *
 * Prototipo estático — visualización "corredor unificado" (Opción B).
 * Datos: corredores-unificados.json (sectores ya validados por el usuario).
 * Horarios: simulados de forma determinista, SOLO para validar el diseño.
 * ------------------------------------------------------------------ */
  const PAD_TOP = 112;        // espacio de título arriba del primer sector
const PLOT_H  = 760;         // alto útil del eje
const T_START = 4*60, T_END = 25*60;    // ventana 04:00 → 01:00 (módulo 24h en display)
const DESDE   = 'corredores-unificados.json';
const SERV_POR_LADO = 11;
let SPACING = 210;

let ejes = [], corridas = [];
let simT = 8*60;   // minimutos continuos del día operativo; la TimeBar T36 lo gobierna (segundos incluidos)
let seleccion = null;   // srv del servicio seleccionado — persiste aunque cambie de banda durante el día
let servicioSegs = {};  // srv -> [tramos (corridas) ordenados por hora de partida]
let SVG_H = 0;
let corredoresAll = [], seleccionados = new Set(), realByCorredor = {};
let sectorSel = null;   // sector o punta seleccionados por clic en su tick/texto (T34): ver pickSector/pickPunta

// color POR CORREDOR (no por línea): cada ramal se distingue, incluso dentro de la misma línea
const COLORS = {
  '101-CEPO-POCE':     '#408040',   // verde salvia oscuro
  '103-GBVG-VGGB':     '#000000',   // negro
  '103-RUVG-VGRU':     '#808080',   // gris
  '107-LIFO-FOLI':     '#800000',   // granate
  '107-LIFA-FALI':     '#804040',   // castaño
  '110-NS-NN'    :     '#008000',   // verde
  // lote 2 (provisionales, ajustar a mano como en T8)
  '122-RICE-CERI':     '#ef6c00',   // naranja
  '122-SECE-CESE':     '#ffb300',   // ámbar
  '126-CELA-LACE':     '#ba68c8',   // amatista claro
  '126-CEOV-OVCE':     '#880e4f',   // burdeos/vino
  '128-NEAS-NECE':     '#8e24aa',   // violeta
  '128-ROFR-ROCE':     '#c2185b',   // magenta
  '130-ROAC-ACCE':     '#ba68c8',   // amatista claro
  '133/125-FUCO-OCFU': '#5d4037',   // marrón
  '133/125-WICO-OCWI': '#8d6e63',   // marrón claro
  '138/139-TFCA-CATF': '#64b5f6',   // azul claro
  '140-TFFL-FLTF':     '#1565c0',   // azul
  // lote 3 (borrador 2026-10-23; hexes provisionales, la paleta final la define el inspector).
  // ids del parseo: primer ramal listado = ida (142 NNFU va primero; compuestas '102/144' y '145/133')
  '142-NSFU-NNFU':     '#455a64',   // azul pizarra
  '142-RS-RN':         '#00695c',   // teal
  '143-GBCA-CAGB':     '#0277bd',   // azul (provisorio)
  '143-RUCA-CARU':     '#00897b',   // teal claro (provisorio)
  '102/144-BONS-NNBO': '#039be5',   // celeste (provisorio)
  '145/133-CACE-CECA': '#ff7043',   // coral (provisorio)
  '145/133-SOCE-CESO': '#607d8b',   // gris azulado (provisorio)
  '146-NS-NN':         '#5c6bc0',   // índigo (provisorio)
  '146-RS-RN':         '#afb42b',   // oliva (provisorio)
};

window.pick = idx => { const c = corridas[idx]; if (!c) return;
  if (sectorSel){ sectorSel = null; pintarSectorSel(); }   // la selección de servicio reemplaza a la del sector
  if (seleccion === c.srv){
    seleccion = null;
    document.getElementById('panel').style.display = 'none';   // deselección por re-touch del punto
  } else {
    seleccion = c.srv;
    pintaInfo(c.srv);
  }
  render(simT); };

/* ---------------- Selector de calendario (hábil / mediofestivo / festivo) ---------------- */
const CALENDARIOS = {
  habiles:      { archivo: 'horarios-habiles.json',      etiqueta: 'día hábil (mar 20/10)' },
  mediofestivo: { archivo: 'horarios-mediofestivo.json', etiqueta: 'mediofestivo (sáb)' },
  festivo:      { archivo: 'horarios-festivo.json',      etiqueta: 'festivo (dom 25/10)' },
};
let calendarioSel = (() => { try { return localStorage.getItem('calendarioSel') || 'mediofestivo'; } catch(_) { return 'mediofestivo'; } })();
let calendarioToken = 0;
let archivoHorarios = 'horarios-reales.json';

async function cargarCalendario(){
  const modo = calendarioSel, info = CALENDARIOS[modo];
  const tk = ++calendarioToken;
  archivoHorarios = info.archivo;
  document.querySelectorAll('#calSel .cal').forEach(ch => ch.classList.toggle('on', ch.dataset.cal === modo));
  try {
    const r = await fetch(info.archivo, { cache: 'no-store' });
    if (tk !== calendarioToken) return;                    // el usuario ya cambió de calendario
    const d = r.ok ? await r.json() : null;
    if (!d){ document.getElementById('msgReal').textContent = `⚠ ${info.archivo} no está (${info.etiqueta})`; return; }
    aplicarReal(d, `${info.archivo} — ${info.etiqueta}`);
  } catch(e){
    if (tk === calendarioToken) document.getElementById('msgReal').textContent = `⚠ ${info.archivo}: ${e.message}`;
  }
}

async function main(){
  const data = await (await fetch(DESDE, { cache: 'no-store' })).json();
  corredoresAll = [];
  for (const ln of data.lineas) for (const c of ln.corredores) corredoresAll.push({...c, linea: ln.linea});
  seleccionados = new Set(corredoresAll.map(c=>c.id));
  buildSelector();
  rebuild();
  initTimebar();
  engancharPanStage();
  // el arranque de la TimeBar T36 fijó el reloj a la HORA REAL (avance 1 s × 1 s) — nada más que hacer acá
  engancharDragPanel();
  cargarCalendario();
  engancharCargaReal();
}

/* ---------- Panel trasladable: arrastrar por el h3 (la ✕ no arrastra) ---------- */
function engancharDragPanel(){
  /* En táctil: hold and slide — se agarra recién tras mantener el dedo ~250 ms;
     si el dedo se mueve antes del grab, se libera y no arrastra nada (evita que
     un rozón sobre la manija mueva toda la app). Mouse/pen agarran al instante. */
  const HOLD = 250, MUERTE = 10;   // ms de espera del hold; px de deriva que liberan el gesto antes del grab
  const el = document.getElementById('panel');
  let drag = null, arm = null, h0 = null;
  el.addEventListener('pointerdown', ev=>{
    if (!ev.target.closest('h3') || ev.target.closest('.x')) return;
    if (ev.pointerType === 'touch'){
      h0 = { x: ev.clientX, y: ev.clientY };
      arm = setTimeout(()=>{ drag = { dx: h0.x - el.getBoundingClientRect().left,
                                       dy: h0.y - el.getBoundingClientRect().top };
                             el.style.right = 'auto';
                             el.classList.add('drag-grab'); }, HOLD);
      try { el.setPointerCapture(ev.pointerId); } catch(_){}
      ev.preventDefault();
    } else {
      drag = { dx: ev.clientX - el.getBoundingClientRect().left,
               dy: ev.clientY - el.getBoundingClientRect().top };
      el.style.right = 'auto';
      try { el.setPointerCapture(ev.pointerId); } catch(_){}
      el.classList.add('drag-grab');
      ev.preventDefault();
    }
  });
  el.addEventListener('pointermove', ev=>{
    if (h0 && !drag && Math.hypot(ev.clientX - h0.x, ev.clientY - h0.y) > MUERTE){ soltar(); return; }   // movió antes del hold: gesto libre (no arrastra)
    if (!drag) return;
    const r = el.getBoundingClientRect();
    const left = Math.min(Math.max(0, ev.clientX - drag.dx), Math.max(0, window.innerWidth  - r.width));
    const top  = Math.min(Math.max(0, ev.clientY - drag.dy), Math.max(0, window.innerHeight - r.height));
    el.style.left = left + 'px';
    el.style.top  = top + 'px';
  });
  const soltar = ()=>{ if (arm){ clearTimeout(arm); arm = null; } h0 = null;
                       drag = null; el.classList.remove('drag-grab'); };
  el.addEventListener('pointerup',     soltar);
  el.addEventListener('pointercancel', soltar);
}

function rebuild(){
  const sel = corredoresAll.filter(c=> seleccionados.has(c.id));
  const svg = document.getElementById('svg');
  svg.innerHTML = '';
  ejes = []; corridas = []; seleccion = null; servicioSegs = {}; sectorSel = null;
  document.getElementById('panel').style.display='none';
  if (!sel.length){
    SVG_H = 300;
    svg.setAttribute('width', 800); svg.setAttribute('height', SVG_H);
    svg.setAttribute('viewBox', `0 0 800 ${SVG_H}`);
    txt(svg, 400, 150, 'No hay líneas/ramales seleccionados', {size:14, fill:'#888', anchor:'middle'});
    return;
  }
  SPACING = Math.max(220, Math.min(300, Math.floor(1500 / sel.length)));
  const width = 60 + SPACING*sel.length;
  SVG_H = PAD_TOP + PLOT_H + 60;
  svg.setAttribute('width', width); svg.setAttribute('height', SVG_H);
  svg.setAttribute('viewBox', `0 0 ${width} ${SVG_H}`);
  sel.forEach((cor, ci)=>{
    const x = 60 + SPACING*ci + SPACING/2;
    const marks = cor.eje.slice().sort((a,b)=>a.orden-b.orden)
        .map((m,i)=> ({...m, y: PAD_TOP + i * PLOT_H/(cor.eje.length-1)}));
    const eje = { id: cor.id, cor, x, marks, color: COLORS[cor.id] || '#667788' };
    ejes.push(eje);
    dibujarEje(svg, eje, ci);
    armarCorridas(eje);
  });

  // encadena los tramos de cada servicio: un mismo Servicio recorre distintas banderas
  // en el día (p.ej. 103-0057: GBVG → VGGB → GBVG → VGRU → RUVG → VGRU ...)
  servicioSegs = {};
  corridas.forEach(c=>{ (servicioSegs[c.srv] ||= []).push(c); });
  for (const list of Object.values(servicioSegs)){
    list.sort((a,b)=> a.times[0] - b.times[0]);
    list.forEach((s,i)=>{ s.segPos = i; s.segs = list; });
  }
  render(simT);
}

/* ------------------------------------------------------------------ */
function dibujarEje(svg, eje, ci){
  const {x, marks, color, cor} = eje;
  const g = mk(svg,'g',{ transform:`translate(${x},0)` });
  const yFin = PAD_TOP + PLOT_H;
  txt(g, 0, PAD_TOP-64, `${cor.linea}`, {size:42, weight:700, fill:color, anchor:'middle'});
  txt(g, 0, PAD_TOP-44, `${cor.banderas.ida}⇄${cor.banderas.vuelta}`, {size:14, weight:700, fill:color, anchor:'middle'});

  // puntas y sectores seleccionables por clic (T34). La punta muestra llegadas+salidas;
  // el sector despliega línea-servicio-bandera-hora filtrado por el LATERAL tocado.
  const paTxt = txt(g, 0, PAD_TOP-26, `▲ ${cor.puntaArriba}`, {size:11, fill:'#555', anchor:'middle'});
  paTxt.setAttribute('onclick',`window.pickPunta('${eje.id}','arriba')`); paTxt.style.cursor='pointer';
  const pbTxt = txt(g, 0, yFin+16, `▼ ${cor.puntaAbajo}`, {size:11, fill:'#555', anchor:'middle'});
  pbTxt.setAttribute('onclick',`window.pickPunta('${eje.id}','abajo')`); pbTxt.style.cursor='pointer';
  if (ci === 0) txt(g, -52, (PAD_TOP+yFin)/2, '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀▼ IDA⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀|⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀VUELTA ▲', {size:9.5, fill:'#999', anchor:'middle'});

  mk(g,'line',{ x1:0, y1:PAD_TOP, x2:0, y2:yFin, stroke:color, 'stroke-width':2.2 });

  marks.forEach((m,i)=>{
    mk(g,'line',{ x1:-6, y1:m.y, x2:6, y2:m.y, stroke:color, 'stroke-width':1.6 });
    if (!m.ida || !m.vuelta) mk(g,'circle',{ cx:-10, cy:m.y, r:2.4, fill:'#0002' });

    // nombres inclinados a ambos lados formando una V respecto al eje vertical:
    //   ida    = trazo "\" que desciende HACIA el eje (anclaje 'end' en el eje, rotación +35°)
    //   vuelta = trazo "/" que asciende DESDE el eje (anclaje 'start' en el eje, rotación -35°)
    // así cada esquina vive en su propia diagonal, sin superponerse con los horarios del punto.
    if (m.tipo === 'oculto') {
      // fila fantasma de alineación entre ejes de la misma línea: tick discontinuo, sin rótulos
      mk(g,'line',{ x1:-14, y1:m.y, x2:14, y2:m.y, stroke:'#b9bdc9', 'stroke-width':1.2, 'stroke-dasharray':'2 3' });
      const tg = mk(g,'title',{});
      tg.textContent = 'fila fantasma (alineación de ejes de la línea)';
      return;
    }
    if (m.ida)    rot(g, -20, m.y+3.5, m.ida,    +35, {size:11, weight:500, fill:'#444', anchor:'end'});
    if (m.vuelta) rot(g, +20, m.y+3.5, m.vuelta, -35, {size:11, weight:500, fill:'#777', anchor:'start'});
    const ti = mk(g,'title',{});
    ti.textContent = `orden ${m.orden} · ida: ${m.ida||'—'} · vuelta: ${m.vuelta||'—'} · ${m.confianza}${m.validadaUsuario?' · validada':''}`;
    // zonas de clic por LATERAL (T34): izquierda = ida, derecha = vuelta; transparentes al render
    // (pointer-events all) y cubren el rótulo diagonal cercano para dar buen blanco táctil
    if (m.tipo !== 'oculto'){
      if (m.ida)   mk(g,'rect',{ x:-26, y:m.y-9, width:26, height:18, fill:'#000', 'fill-opacity':0,
                                 'pointer-events':'all', style:'cursor:pointer',
                                 onclick:`window.pickSector('${eje.id}',${i},'ida')` });
      if (m.vuelta) mk(g,'rect',{ x:0, y:m.y-9, width:26, height:18, fill:'#000', 'fill-opacity':0,
                                  'pointer-events':'all', style:'cursor:pointer',
                                  onclick:`window.pickSector('${eje.id}',${i},'vuelta')` });
    }
  });
}

/* ---------- Horarios simulados: deterministas ---------- */
function hashStr(s){ let h=7; for (let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))&0x7fffffff; return h; }
function prng(seed){ let s=(seed%2147483647)||1; return ()=>{ s=(s*16807+11)%2147483647; return (s%100000)/100000; }; }

/* ---------------- Horarios reales: armo corridas si hay datos, si no simulo ---------------- */
function armarCorridas(eje){
  const real = realByCorredor[eje.cor.id] || {};
  if (real.ida)    corridaDesdeReal(eje, 'ida',    real.ida);    else simularHorariosLado(eje, 'ida');
  if (real.vuelta) corridaDesdeReal(eje, 'vuelta', real.vuelta);  else simularHorariosLado(eje, 'vuelta');
}

function simularHorariosLado(eje, lado){
  const {cor, color} = eje;
  const route = lado==='ida' ? eje.marks.filter(m=>m.ida && m.tipo!=='oculto')
                             : eje.marks.filter(m=>m.vuelta && m.tipo!=='oculto').slice().reverse();
  const n = route.length;
  const seed = hashStr(cor.id) + (lado==='vuelta' ? 57 : 0);
  for (let k=0; k<SERV_POR_LADO; k++){
    const r = prng((seed + k*101) | 0);
    const salida   = 5*60 + 30 + k*(960/SERV_POR_LADO)*(0.85 + 0.3*r());
    const totalMin = 10 + (n-1)*(1.2 + 1.0*r()) + 25*r();
    corridas.push({ ejeId:eje.id, cor, lado, color,
                    srv:`${cor.linea}-s${k+1}`, marks:route,
                    times: route.map((_,i)=> salida + i*(totalMin/(n-1))) });
  }
}

/* ---------------- Mapeo HorariosPorSectorDto (app ROSBUS) → corridas del eje ----------------
   Cada Item del dto es UN servicio: { Servicio, Sale, Llega, ColumnasDinamicas:[{Orden, Hora|HoraFormated}] }.
   Sale = punta de origen, Llega = punta de destino, dinámicas = sectores intermedios.
   La ruta del lado se recorre en orden de viaje: ida N→S (orden asc), vuelta S→N (orden desc). */
function parseHora(s){
  const m = /^\s*(\d{1,2}):(\d{2})(?::\d{2})?\s*$/.exec(String(s||''));
  return m ? (+m[1])*60 + (+m[2]) : null;
}
function asegurarCreciente(arr){
  let prev = -Infinity;
  return arr.map(t=>{ if (t==null) return null; let v=t; while (v<=prev) v+=1440; prev=v; return v; });
}
function corridaDesdeReal(eje, lado, dto){
  const base = eje.marks.slice().sort((a,b)=>a.orden-b.orden);
  const side = lado==='ida' ? base.filter(m=>m.ida && m.tipo!=='oculto')
                            : base.filter(m=>m.vuelta && m.tipo!=='oculto').slice().reverse();
  const items = (dto && dto.Items) || [];
  items.forEach((row,k)=>{
    if (!row) return;
    const dins = (row.ColumnasDinamicas||[]).slice().sort((a,b)=>((a.Orden??0)-(b.Orden??0)));
    let horas = null;
    if (dins.length === side.length){
      horas = asegurarCreciente(dins.map(d=>parseHora(d.HoraFormated||d.Hora)));
    } else if (dins.length === side.length - 2){
      horas = asegurarCreciente([parseHora(row.Sale), ...dins.map(d=>parseHora(d.HoraFormated||d.Hora)), parseHora(row.Llega)]);
    }
    if (!horas || horas.some(t=>t==null)){
      // conteo imprevisto u hora ilegible: distribuye toda hora disponible (Sale/dinámicas/Llega)
      const comb = [parseHora(row.Sale), ...dins.map(d=>parseHora(d.HoraFormated||d.Hora)), parseHora(row.Llega)].filter(t=>t!=null);
      if (comb.length < 2) return;
      horas = asegurarCreciente(side.map((_,i)=> comb[Math.min(comb.length-1, Math.round(i*(comb.length-1)/(side.length-1)))]));
    }
    const srv = String(row.Servicio ?? ('s'+(k+1))).replace(/\s+/g,'');
    // row adjunta el dto original: pintaSector/pintaPunta leen Bandera (la banda que el
    // backend reportó ESE día, p.ej. el mismo tramo puede mostrarse con otra banda según calendario)
    corridas.push({ ejeId:eje.id, cor:eje.cor, lado, color:eje.color,
                    srv:`${eje.cor.linea}-${srv}`, marks:side, times:horas, row });
  });
}

/* ---------------- Buscador de líneas + selector de ramales ---------------- */
let lineasSel = [];    // líneas elegidas en el buscador (multi por coma); vacío = mostrar todas

function elegirLineas(arr){
  lineasSel = [...arr];
  seleccionados = new Set(corredoresAll.filter(c=> lineasSel.includes(c.linea)).map(c=>c.id));
  buildSelector();
  rebuild();
  window.scrollTo(0,0);
}
function elegirLinea(n){ elegirLineas([n]); }

function buildSelector(){
  const el = document.getElementById('selector');
  el.innerHTML = '';
  const lineas = [...new Set(corredoresAll.map(c=>c.linea))];

  // --- buscador de líneas (input + dropdown de sugerencias) ---
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;';
  const inp = document.createElement('input');
  inp.type = 'search';
  inp.placeholder = 'Buscar línea… (multi: 101, 133/125)';
  inp.autocomplete = 'off';
  inp.style.cssText = 'padding:5px 10px;border-radius:14px;border:1px solid #999;background:#fff;font-size:12px;width:230px;';
  const drop = document.createElement('div');
  drop.style.cssText = 'position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:#fff;border:1px solid #ccc;'
    + 'border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;min-width:240px;max-height:200px;overflow:auto;';
  wrap.appendChild(inp); wrap.appendChild(drop);
  el.appendChild(wrap);

  // match por prefijo con fallback a contains y a dígitos solos (soporta líneas compuestas '133/125'): '1' → 101/110 (no 103/107), '3' → 103, '133125'/'133/125' → 133/125
  const hits = q => {
    if (!q) return lineas;
    const pre = lineas.filter(l=> String(l).startsWith(q));
    if (pre.length) return pre;
    const cont = lineas.filter(l=> String(l).includes(q));
    if (cont.length) return cont;
    return lineas.filter(l=> String(l).replace(/\D+/g,'').includes(q));
  };
  // multi: tokens separados por coma; cada token resuelve con el mismo encadenado (prefijo → contains → dígitos)
  const resolveMulti = q => {
    const toks = q.split(',').map(t=>t.trim()).filter(Boolean);
    const found = new Set(), failed = [];
    for (const tk of toks){
      const d = (tk.match(/\d+/g) || []).join('');
      const m = d ? hits(d) : [];
      if (m.length) m.forEach(l=>found.add(l)); else failed.push(tk);
    }
    return { lineas: [...found], failed };
  };
  const renderDrop = ()=>{
    const q = (inp.value.match(/\d+/g) || []).join('');
    drop.innerHTML = '';
    if (inp.value.includes(',')){
      const { lineas: ml, failed } = resolveMulti(inp.value);
      ml.forEach(l=>{
        const it = document.createElement('div');
        it.style.cssText = 'padding:6px 10px;cursor:pointer;font-size:12px;';
        it.innerHTML = `<b>${l}</b> — ${corredoresAll.filter(c=>c.linea===l)
          .map(c=> c.banderas.ida+'⇄'+c.banderas.vuelta).join(' · ')}`;
        it.onclick = ()=>{ drop.style.display = 'none'; elegirLinea(l); };
        drop.appendChild(it);
      });
      if (ml.length){
        const it = document.createElement('div');
        it.style.cssText = 'padding:6px 10px;cursor:pointer;font-size:12px;background:#f7f8ff;font-weight:700;';
        it.innerHTML = `→ seleccionar ${ml.length} líneas: ${ml.join(', ')}`
          + (failed.length ? ` · sin match: ${failed.join(', ')}` : '');
        it.onclick = ()=>{ drop.style.display = 'none'; elegirLineas(ml); };
        drop.appendChild(it);
      }
    }
    hits(q).forEach(l=>{
      const it = document.createElement('div');
      it.style.cssText = 'padding:6px 10px;cursor:pointer;font-size:12px;';
      it.innerHTML = `<b>${l}</b> — ${corredoresAll.filter(c=>c.linea===l)
        .map(c=> c.banderas.ida+'⇄'+c.banderas.vuelta).join(' · ')}`;
      it.onmouseenter = ()=> it.style.background = '#f2f3f8';
      it.onmouseleave = ()=> it.style.background = '#fff';
      it.onclick = ()=>{ drop.style.display = 'none'; elegirLinea(l); };
      drop.appendChild(it);
    });
    drop.style.display = hits(q).length ? 'block' : 'none';
  };
  if (lineasSel.length === 1) inp.value = `Línea ${lineasSel[0]}`;
  else if (lineasSel.length > 1) inp.value = `Líneas ${lineasSel.join(', ')}`;
  inp.onfocus = ()=>{ if (lineasSel.length) inp.value = ''; renderDrop(); };
  inp.oninput = renderDrop;
  inp.onkeydown = e=>{ if (e.key === 'Enter'){
    if (inp.value.includes(',')){
      const { lineas: ml } = resolveMulti(inp.value);
      if (ml.length){ drop.style.display = 'none'; elegirLineas(ml); }
      return;
    }
    const m = hits((inp.value.match(/\d+/g) || []).join(''));
    if (m.length === 1){ drop.style.display = 'none'; elegirLinea(m[0]); }
  }};
  inp.onblur = ()=> setTimeout(()=>{ inp.value = lineasSel.length === 1 ? `Línea ${lineasSel[0]}`
    : (lineasSel.length ? `Líneas ${lineasSel.join(', ')}` : ''); }, 150);
  if (!window.__dropLineasHook){
    window.__dropLineasHook = true;
    document.addEventListener('click', e=>{
      const d = document.getElementById('dropLineas');
      // el drop ya no existe si el selector fue reconstruido; el actual queda en el DOM
      const vivo = document.querySelector('#selector input');
      if (d && e.target !== vivo && !e.target.closest('#selector')) d.style.display = 'none';
    });
  }

  // --- selector de ramales-banderas de la línea elegida ---
  const chip = (txt, on, fn, extra='') => {
    const d = document.createElement('div');
    d.className = `chip${on?' on':' off'}`;
    d.textContent = txt + extra;
    d.onclick = fn;
    el.appendChild(d);
  };
  if (lineasSel.length === 0){
    chip('todas las líneas — busque una (multi: 101, 133/125)', true, ()=>{});
  } else {
    corredoresAll.filter(c=> lineasSel.includes(c.linea)).forEach(c=>{
      const real = realByCorredor[c.id] || {};
      const extra = (real.ida && real.vuelta) ? ' ⚡'
                  : (real.ida ? ' ⚡ida' : (real.vuelta ? ' ⚡vuelta' : ''));
      chip(`${c.banderas.ida}⇄${c.banderas.vuelta}`, seleccionados.has(c.id),
        ()=>{ seleccionados.has(c.id) ? seleccionados.delete(c.id) : seleccionados.add(c.id);
              buildSelector(); rebuild(); }, extra);
    });
    chip('↩ todas las líneas', false, ()=>{
      lineasSel = [];
      seleccionados = new Set(corredoresAll.map(c=>c.id));
      buildSelector(); rebuild();
    });
  }
}

/* ---------------- Carga de archivo horarios-reales.json ---------------- */
function aplicarReal(data, fuente){
  realByCorredor = {};                     // cada calendario reemplaza al anterior; sin residuos
  let n = 0;
  for (const [id, dto] of Object.entries(data || {})){
    if (!corredoresAll.some(c=>c.id === id)) continue;
    realByCorredor[id] = { ida: (dto && dto.ida) || null, vuelta: (dto && dto.vuelta) || null };
    if (dto && (dto.ida || dto.vuelta)) n++;
  }
  buildSelector(); rebuild();
  document.getElementById('msgReal').textContent =
    n ? `✔ ${n} corredor(es) con horarios reales (${fuente})`
      : `sin coincidencias para horarios reales (${fuente})`;
}
function engancharCargaReal(){
  document.querySelectorAll('#calSel .cal').forEach(ch => {
    ch.onclick = ()=>{
      if (calendarioSel === ch.dataset.cal) return;
      calendarioSel = ch.dataset.cal;
      try { localStorage.setItem('calendarioSel', calendarioSel); } catch(_){}
      cargarCalendario();
    };
  });
  document.getElementById('lblReal').onclick = ()=> document.getElementById('fileReal').click();
  document.getElementById('fileReal').addEventListener('change', ev=>{
    const f = ev.target.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{ try { aplicarReal(JSON.parse(fr.result), f.name); }
                      catch(e){ document.getElementById('msgReal').textContent = '⚠ JSON inválido: ' + e.message; } };
    fr.readAsText(f);
  });
}

/* ---------- Render por minuto simulado ---------- */
function render(min){
  tossOld('dotsLayer');
  const svg = document.getElementById('svg');
  const g = mk(svg,'g',{ id:'dotsLayer' });
  corridas.forEach((c,i)=> dibujarCorrida(g, c, i, min));
  if (seleccion !== null) dibujarServicio(g, servicioSegs[seleccion]);
  // estados dinámicos del cuadro del servicio seleccionado (pasado gris / próximo rojo / futuro negro)
  panelDinamica();
}

function dibujarCorrida(g, c, idx, min){
  const Ts = c.times, Ms = c.marks;
  const nxt = c.segs && c.segs[c.segPos+1];
  const prv = c.segs && c.segs[c.segPos-1];

  // PERSISTENCIA del servicio (T33 rev. + límite ±7 min del inspector): el punto
  // se muestra estacionado MIENTRAS espera en una punta, con persistencia acotada:
  // desde 7 min antes de que comience a moverse (cada partida) y hasta 7 min tras
  // finalizar el servicio (última llegada). Esperas largas no mantienen el punto
  // en el medio del hueco. Si el servicio cambia de ramal (próximo tramo en otro
  // eje), la espera se pinta en el eje donde va a continuar su servicio — punta
  // de origen del próximo tramo, con el lado de ESE ramal. En movimiento, sin
  // persistencia en el extremo.
  const PERSIST = 7;   // ventanas de estacionamiento, en minutos
  let st;   // {ejeId, lado, y, parked} — estado del punto en este minuto
  if (min > Ts[Ts.length-1]){
    if (nxt){
      if (min >= nxt.times[0]-3 || min < nxt.times[0]-PERSIST) return;   // handoff / hueco largo sin estacionado
      st = { ejeId:nxt.ejeId, lado:nxt.lado, y:nxt.marks[0].y, parked:true };
    } else {
      if (min > Ts[Ts.length-1] + PERSIST) return;   // ya pasó la ventana de 7 min tras finalizar
      st = { ejeId:c.ejeId, lado:c.lado, y:Ms[Ms.length-1].y, parked:true };
    }
  } else if (min < Ts[0]-3){
    // espera en la punta de origen antes de la primera partida; la espera ENTRE tramos
    // la dibuja el tramo anterior (ya sobre el eje de este): sólo en la ventana
    // de 7 min previa a la partida
    if (prv || min < Ts[0]-PERSIST) return;
    st = { ejeId:c.ejeId, lado:c.lado, y:Ms[0].y, parked:true };
  } else {
    let j = 0; while (j < Ts.length-1 && Ts[j+1] <= min) j++;
    const i = Math.min(j, Ts.length-2);
    const f = Math.min(1, Math.max(0, (min - Ts[i]) / ((Ts[i+1]-Ts[i]) || 1)));
    st = { ejeId:c.ejeId, lado:c.lado, y:Ms[i].y + (Ms[i+1].y - Ms[i].y)*f, parked:false };
  }
  const ej = ejes.find(e=>e.id===st.ejeId);
  if (!ej) return;
  const y = st.y, parked = st.parked, lado = st.lado;
  const cx = ej.x + (lado==='ida' ? -14 : 14);
  const sel = c.srv === seleccion;
  const color = ej.color || c.color;
  mk(g,'circle',{ class:'dot', cx, cy:y, r: parked? 4 : 5,
                  fill:color, opacity: parked? (sel? .85 : .55) : .92, style:'cursor:pointer',
                  onclick:`window.pick(${idx})` });

  if (!parked || sel){
    // badge = número línea-servicio + TRIÁNGULO SVG (el carácter Unicode ↓/↑ no se renderiza
    // en la fuente del badge; un polígono es determinista en cualquier font)
    const badge = c.srv;
    const tx = cx + (lado==='ida'? -9 : 9);
    const W = badge.length*7.6;                   // ancho estimado del texto (calibrado a font-size 12)
    if (sel) mk(g,'rect',{ x: lado==='ida'? tx-W-14 : tx-4, y: y-11.5, width:W+18, height:19, rx:8,
                           fill:color, opacity:.22 });
    const lbl = mk(g,'text',{ x: tx, y: y+4.3, 'font-size':14, fill: sel?'#111':'#222', opacity: parked? .6 : 1,
                              'font-weight':700, 'text-anchor': lado==='ida'?'end':'start' });
    lbl.style.cursor = 'pointer';
    lbl.textContent = badge;
    lbl.setAttribute('onclick',`window.pick(${idx})`);
    // triángulo dirección, espejado respecto al eje: ida ↓ (a la izquierda) / vuelta ↑ (a la derecha)
    const triX = lado==='ida' ? tx-W-8 : tx+W+8;
    const tri = lado==='ida'
      ? `${triX-3.5},${y-2.4} ${triX+3.5},${y-2.4} ${triX},${y+3}`     // apunta abajo
      : `${triX-3.5},${y+2.4} ${triX+3.5},${y+2.4} ${triX},${y-3}`;   // apunta arriba
    const pg = mk(g,'polygon',{ points:tri, fill: sel?'#111':'#222', opacity: parked? .6 : 1 });
    pg.style.cursor = 'pointer';
    pg.setAttribute('onclick',`window.pick(${idx})`);
  }
}

function dibujarServicio(g, segs){
  if (!segs || !segs.length) return;
  // tramo activo: el último que ya partió; el servicio recorre banderas distintas en el día
  let act = segs[0];
  for (const s of segs) if (simT >= s.times[0]) act = s;
  const ej = ejes.find(e=>e.id===act.ejeId);
  if (!ej) return;
  const x  = ej.x + (act.lado==='ida'? -14 : 14);
  const Ts = act.times, Ms = act.marks;
  const PERSIST = 7;   // ventana de estacionamiento, en minutos (T33 rev. del inspector)
  const nx = segs[segs.indexOf(act)+1];

  // ventana de representación del servicio: desde 7 min antes de la primera
  // partida hasta 7 min después de finalizar; las esperas largas NO mantienen
  // el punto estacionado en el medio del hueco
  if (simT > Ts[Ts.length-1]){
    if (!nx){ if (simT > Ts[Ts.length-1]+PERSIST) return; }
    else    { if (simT < nx.times[0]-PERSIST) return; }
  } else if (simT < Ts[0]-PERSIST) return;

  // línea punteada del tramo activo con la hora de paso de cada sector (centrada bajo el punto)
  mk(g,'polyline',{ points: Ms.map(m=>`${x},${m.y}`).join(' '),
                    fill:'none', stroke:'#222', 'stroke-width':1, 'stroke-dasharray':'2 3', opacity:.5 });
  Ms.forEach((m,i)=>{
    mk(g,'circle',{ cx:x, cy:m.y, r:2.6, fill:'#222', opacity:.8 });
    const lb = mk(g,'text',{ x, y:m.y+14.5, 'font-size':12, fill:'#333', 'font-weight':700, 'text-anchor':'middle' });
    lb.textContent = fmt(Ts[i]);
  });

  // aro fino del servicio seleccionado: interpolado dentro del tramo activo;
  // en espera entre tramos estaciona en la punta de origen del PRÓXIMO tramo (T33):
  // si cambia de ramal, el aro pasa al eje donde va a continuar el servicio, con
  // el lado de ese ramal; antes de la primera partida, en su punta de origen;
  // tras finalizar, estacionado hasta 7 min después de la última llegada (rev.).
  let ringEje = ej, ringLado = act.lado;
  let y;
  if (simT < Ts[0])                y = Ms[0].y;
  else if (simT <= Ts[Ts.length-1]){
    let i = 0; while (i < Ts.length-1 && Ts[i+1] <= simT) i++;
    if (i > Ts.length-2) i = Ts.length-2;
    const f = Math.min(1, Math.max(0, (simT - Ts[i]) / ((Ts[i+1]-Ts[i]) || 1)));
    y = Ms[i].y + (Ms[i+1].y - Ms[i].y)*f;
  } else {
    if (!nx) y = Ms[Ms.length-1].y;
    else { ringEje = ejes.find(e=>e.id===nx.ejeId); ringLado = nx.lado; y = nx.marks[0].y; }
  }
  mk(g,'circle',{ cx: ringEje.x + (ringLado==='ida'? -14 : 14), cy:y, r:9, fill:'none', stroke:'#111', 'stroke-width':1.4, opacity:.95 });
}

/* ---------- Panel de info ---------- */
window.cerrarPanel = () => {
  // la X sólo cierra el cuadro: la selección del servicio permanece en la gráfica
  // (aro fino) hasta volver a tocar el punto/badge para deseleccionar.
  // Excepción (T33 rev.): si el servicio ya terminó su día ya no tiene punto en el
  // mapa para deseleccionarlo — la X limpia también la selección para no dejarla
  // pegada sin representación visual.
  document.getElementById('panel').style.display = 'none';
  if (seleccion !== null){
    const segs = servicioSegs[seleccion];
    const visible = segs && segs.some(c=>{
      const Ts = c.times;
      const nxt = c.segs && c.segs[c.segPos+1], prv = c.segs && c.segs[c.segPos-1];
      const PERSIST = 7;   // ventana de estacionamiento, en minutos (rev. del inspector)
      if (simT > Ts[Ts.length-1]){
        if (!nxt) return simT <= Ts[Ts.length-1]+PERSIST;                  // estacionado hasta 7 min tras finalizar
        return simT >= nxt.times[0]-PERSIST;                               // estacionado desde 7 min antes de la siguiente partida
      }
      if (simT < Ts[0]-3)         return !prv && simT >= Ts[0]-PERSIST;    // espera pre-1.ª partida (ventana 7 min)
      return true;                                                          // en movimiento / pre-roll
    });
    if (!visible){
      seleccion = null;
      render(simT);
    }
  }
};

function pintaInfo(srv){
  // (el hover se eliminó: el cuadro del servicio es una función de la selección, punto único de apertura)
  const segs = servicioSegs[srv];
  if (!segs) return;
  const e = document.getElementById('panel');
  e.style.display = 'block';

  // próximo sector con partida futura (el primero en orden global del itinerario)
  let prox = null; // [iTramo, jSector]
  outer: for (let i=0; i<segs.length; i++)
    for (let j=0; j<segs[i].times.length; j++)
      if (segs[i].times[j] > simT){ prox = [i,j]; break outer; }

  // itinerario completo: un bloque por tramo (la banda puede cambiar durante el servicio)
  const bloques = segs.map((c,i)=>{
    const filas = c.marks.map((m,j)=>{
      // cada tramo lista SOLO los sectores del lado en que circula el servicio (T32)
      const nombre = m[c.lado] || m[c.lado==='ida' ? 'vuelta' : 'ida'];
      const proxEste = prox && prox[0]===i && prox[1]===j;
      const estado = proxEste ? 'prox' : (c.times[j] <= simT ? 'pas' : 'fut');
      return `<tr class="${estado}" data-t="${c.times[j]}"><td>${nombre}</td><td>${fmt(c.times[j])}</td></tr>`;
    }).join('');
    const flecha = c.lado==='ida' ? 'ida ↓' : 'vuelta ↑';
    const head = `<tr class="segh"><td colspan="2">${segs.length>1 ? (i+1)+'. ' : ''}${flecha} · ${c.marks[0][c.lado]} → ${c.marks[c.marks.length-1][c.lado]} · ${fmt(c.times[0])}</td></tr>`;
    return head + filas;
  }).join('');
  const x = `<span class="x" title="Cerrar cuadro (la selección permanece; si el servicio ya terminó su día se limpia)" onclick="window.cerrarPanel()">✕</span>`;
  e.innerHTML = `<h3>${srv} · línea ${segs[0].cor.linea} · ${segs.length} tramo(s)${x}</h3>
    <table>${bloques}</table>
    <div style="margin-top:6px;color:#999">X cierra este cuadro · tocá el punto otra vez para deseleccionar (si el servicio ya terminó, la X lo deselecciona)</div>`;
}

// refresco SOLO de estados del cuadro abierto (sin reconstruir el DOM, conserva el scroll del panel)
// gobierna tanto el panel de servicio (seleccion) como los de sector/punta (sectorSel, T34):
// filas con hora ya pasada → 'pas' (gris), la más próxima sin pasar → 'prox', el resto 'fut'
function panelDinamica(){
  const e = document.getElementById('panel');
  if (!seleccion && !sectorSel) return;
  if (e.style.display === 'none') return;
  const filas = e.querySelectorAll('tr[data-t]');
  let proxIdx = filas.length;
  for (let k=0; k<filas.length; k++)
    if (+filas[k].dataset.t > simT){ proxIdx = k; break; }
  filas.forEach((tr,k)=> tr.setAttribute('class',
    k===proxIdx ? 'prox' : (k < proxIdx ? 'pas' : 'fut')));
}

/* ---------- Selección de sector y de punta (T34) ----------
   Clic en el lateral ida/vuelta de un sector (o en la ▲/▼ punta) lo marca como
   seleccionado y abre el panel con línea-servicio-bandera-hora. Si la esquina es
   común a varios ejes visibles (cánones iguales), el panel lista los ramales de
   TODOS esos ejes; la banda que se muestra por fila es la que reportó el backend
   para el calendario cargado (row.Bandera, p.ej. la vuelta de 142 puede venir con
   otra banda según día). Re-tocar el mismo sector/punta deselecciona. La capa de
   resaltado vive en sectorSelLayer: render() sólo renueva dotsLayer. */
function CAN(s){ return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .split(/[^A-Z0-9]+/).filter(Boolean).map(t=> ALIAS_TOK[t] || t).sort().join('|'); }   // misma esquina aunque cambie el orden de calles
// abreviaturas del corpus que conviven con su forma larga en otros corredores (derivado del corpus 26/10):
// 'SanMartín' (142) ⇄ 'SMartín' (103), 'SanJuan' ⇄ 'SJuan', 'SanDiego' ⇄ 'SDiego' — la tabla la une
const ALIAS_TOK = { SANMARTIN:'SMARTIN', SANJUAN:'SJUAN', SANDIEGO:'SDIEGO' };

window.pickSector = (cid, filaIdx, lado) => {
  if (sectorSel && !sectorSel.punta && sectorSel.ori &&
      sectorSel.ori.cid===cid && sectorSel.ori.filaIdx===filaIdx && sectorSel.ori.lado===lado){
    sectorSel = null;                                          // re-tocar el mismo sector: deselección
    document.getElementById('panel').style.display = 'none';
    pintarSectorSel(); return;
  }
  const ej = ejes.find(e=>e.id===cid); const mark = ej && ej.marks[filaIdx];
  const nombre = mark && mark[lado];
  if (!nombre) return;
  sectorSel = { punta:false, lado, canon:CAN(nombre), nombre, ori:{cid,filaIdx,lado} };
  sectorSel.hits = ecuHits('sector');
  // una sola selección activa a la vez: abrir el sector deselecciona el servicio (y vice-versa en window.pick)
  seleccion = null; render(simT);
  pintaSector(); pintarSectorSel();
};

window.pickPunta = (cid, pos) => {
  const ej = ejes.find(e=>e.id===cid); if (!ej) return;
  if (sectorSel && sectorSel.punta && sectorSel.ori.cid===cid && sectorSel.ori.pos===pos){
    sectorSel = null;
    document.getElementById('panel').style.display = 'none';
    pintarSectorSel(); return;
  }
  const nombre = pos==='arriba' ? ej.cor.puntaArriba : ej.cor.puntaAbajo;
  sectorSel = { punta:true, pos, canon:CAN(nombre), nombre, ori:{cid,pos} };
  sectorSel.hits = ecuHits('punta');
  seleccion = null; render(simT);
  pintaPunta(); pintarSectorSel();
};

function ecuHits(kind){
  const S = sectorSel;
  return ejes.filter(e=> seleccionados.has(e.id))
    .map(e=>{
      if (kind==='sector'){
        for (let j=0; j<e.marks.length; j++){
          const m = e.marks[j];
          if (m.tipo!=='oculto' && m[S.lado] && CAN(m[S.lado])===S.canon) return {cid:e.id, filaIdx:j};
        }
      } else {
        const punta = S.pos==='arriba' ? e.cor.puntaArriba : e.cor.puntaAbajo;
        if (CAN(punta)===S.canon) return {cid:e.id, filaIdx:null};
      }
      return null;
    }).filter(Boolean);
}

// banda de la fila: la que reportó el backend para el día cargado (row.Bandera);
// corredor simulado (sin datos reales): la banda propia del corredor
const bandaDe = c => (c.row && String(c.row.Bandera||'').trim()) || c.cor.banderas[c.lado];

function pintaSector(){
  const e = document.getElementById('panel'), S = sectorSel;
  const filas = [];
  S.hits.forEach(h=>{
    const ej2 = ejes.find(x=>x.id===h.cid), cor = ej2.cor, mark = ej2.marks[h.filaIdx];
    corridas.filter(c=> c.ejeId===h.cid && c.lado===S.lado).forEach(c=>{
      const j = c.marks.indexOf(mark);           // mismos objetos de marca → el índice está alineado por orden
      if (j < 0 || c.times[j]==null) return;
      filas.push({ srv:c.srv, banda:bandaDe(c), hora:c.times[j], color:c.color });
    });
  });
  filas.sort((a,b)=> a.hora-b.hora || a.srv.localeCompare(b.srv));
  const ramales = S.hits.map(h=>{
    const ej2 = ejes.find(x=>x.id===h.cid);
    return `${ej2.cor.linea}-${ej2.cor.banderas[S.lado]}`;
  });
  const variantes = [...new Set(S.hits.map(h=>{
    const ej2 = ejes.find(x=>x.id===h.cid);
    return ej2.marks[h.filaIdx][S.lado];
  }))];
  const x = `<span class="x" title="Cerrar cuadro (el sector sigue marcado; re-tocá el sector para deseleccionar)" onclick="window.cerrarPanel()">✕</span>`;
  e.innerHTML = `<h3>${S.nombre}${x}</h3>
    <div class="km">sector · lateral ${S.lado==='ida' ? 'izquierdo (ida ↓)' : 'derecho (vuelta ↑)'} · ramales: ${ramales.join(' · ')}</div>
    ${variantes.length>1 ? `<div class="km">también rotulado: ${variantes.join(' / ')}</div>` : ''}
    <table class="secc">${filas.map(f=>
      `<tr data-t="${f.hora}"><td><span class="cDot" style="background:${f.color}"></span>${f.srv}</td><td>${f.banda}</td><td>${fmt(f.hora)}</td></tr>`).join('')}</table>
    <div style="margin-top:6px;color:#999">la banda es la que reportó el backend para el calendario cargado · ${filas.length} paso(s) · las horas ya pasadas quedan en gris a medida que avanza el tiempo</div>`;
  e.style.display = 'block';
  panelDinamica();
}

function pintaPunta(){
  const e = document.getElementById('panel'), S = sectorSel;
  const filas = [];
  S.hits.forEach(h=>{
    const ej2 = ejes.find(x=>x.id===h.cid), cor = ej2.cor;
    for (const lado of ['ida','vuelta']){
      const lus = corridas.filter(c=> c.ejeId===h.cid && c.lado===lado);
      if (!lus.length || !lus[0].marks.length) continue;
      // las corridas del lado ya están alineadas al orden de viaje:
      // ida sale de puntaArriba (índice 0) y llega a puntaAbajo (último); vuelta al revés
      const jPunta = (lado==='ida') === (S.pos==='arriba') ? 0 : lus[0].marks.length-1;
      const tipo   = (lado==='ida') === (S.pos==='arriba') ? 'sale' : 'llega';
      const bandita= lado==='ida' ? cor.banderas.ida : cor.banderas.vuelta;
      lus.forEach(c=>{
        const t = c.times[jPunta];
        if (t==null) return;
        filas.push({ srv:c.srv, banda:bandaDe(c), hora:t, color:c.color,
                     tag: tipo==='sale' ? 'sale '+ (lado==='ida'?'↓':'↑') : 'llega '+ (lado==='ida'?'↓':'↑'),
                     bandita });
      });
    }
  });
  filas.sort((a,b)=> a.hora-b.hora || a.srv.localeCompare(b.srv));
  const x = `<span class="x" title="Cerrar cuadro (la punta sigue marcada; re-tocá la punta para deseleccionar)" onclick="window.cerrarPanel()">✕</span>`;
  e.innerHTML = `<h3>${S.nombre}${x}</h3>
    <div class="km">punta ${S.pos==='arriba' ? '▲ arriba' : '▼ abajo'} · llegadas + salidas en la misma esquina · ${S.hits.length} eje(s)</div>
    <table class="secc">${filas.map(f=>
      `<tr data-t="${f.hora}"><td><span class="cDot" style="background:${f.color}"></span>${f.srv}</td><td>${f.tag} · ${f.bandita}</td><td>${fmt(f.hora)}</td></tr>`).join('')}</table>
    <div style="margin-top:6px;color:#999">la banda es la que reportó el backend para el calendario cargado · ${filas.length} movimiento(s) · los movimientos ya pasados quedan en gris a medida que avanza el tiempo</div>`;
  e.style.display = 'block';
  panelDinamica();
}

// marca persistente del sector/punta seleccionado (capa propia: la animación no la borra)
// T34 rev.: la marca transversal se resalta SOLO con banda + trazo grueso (sin círculos) y
// el NOMBRE del sector seleccionado lleva un badge del color del corredor sobre su rótulo.
const wTxt = t => Array.from(String(t)).reduce((a,ch)=> a + (ch===' ' ? 3.2 : 6.4), 0);
function pintarSectorSel(){
  tossOld('sectorSelLayer');
  if (!sectorSel) return;
  const svg = document.getElementById('svg');
  const g0 = mk(svg,'g',{ id:'sectorSelLayer' });
  sectorSel.hits.forEach(h=>{
    const ej = ejes.find(e=>e.id===h.cid); if (!ej) return;
    const g = mk(g0,'g',{ transform:`translate(${ej.x},0)` });
    if (sectorSel.punta){
      const ms = ej.marks.filter(m=> m.tipo!=='oculto');
      const m = sectorSel.pos==='arriba' ? ms[0] : ms[ms.length-1];
      if (!m) return;
      mk(g,'line',{ x1:-14, y1:m.y, x2:14, y2:m.y, stroke:ej.color, 'stroke-width':2.8 });
      // badge de la punta: mismo color, sobre el rótulo ▲/▼ (no rotado)
      const textu = (sectorSel.pos==='arriba' ? '▲ ' : '▼ ')
                  + ej.cor[sectorSel.pos==='arriba' ? 'puntaArriba' : 'puntaAbajo'];
      const w = wTxt(textu);
      const yT = sectorSel.pos==='arriba' ? PAD_TOP-26 : PAD_TOP+PLOT_H+16;
      const rP = mk(g,'rect',{ x:-w/2-8, y:yT-11, width:w+16, height:15, rx:5, fill:ej.color });
      const tP = txt(g, 0, yT, textu, {size:11, weight:600, fill:'#fff', anchor:'middle'});
      ajustarBadge(rP, tP, 'middle');          // si el navegador mide el texto, el badge calza exacto
      return;
    }
    const m = ej.marks[h.filaIdx]; if (!m) return;
    const sideName = m[sectorSel.lado]; if (!sideName) return;
    // marca transversal: banda translúcida + trazo grueso (sin aro circular)
    mk(g,'rect',{ x:-16, y:m.y-9, width:32, height:18, rx:4, fill:ej.color, opacity:.16 });
    mk(g,'line',{ x1:-12, y1:m.y, x2:12, y2:m.y, stroke:ej.color, 'stroke-width':2.8 });
    // badge sobre el rótulo diagonal del LADO elegido: geometría idéntica a dibujarEje
    // (rot() ancla en ±20, m.y+3.5 y rota ∓35°) → translate + rotate equivalente
    const idaLado = sectorSel.lado==='ida';
    const w = wTxt(sideName);
    const gb = mk(g,'g',{ transform:`translate(${idaLado ? -20 : 20},${m.y+3.5}) rotate(${idaLado ? 35 : -35})` });
    const rB = mk(gb,'rect',{ x: idaLado ? -(w+9) : -9, y:-7.5, width:w+17, height:15, rx:4.5, fill:ej.color });
    const tB = txt(gb, 0, 0, sideName, {size:11, weight:600, fill:'#fff', anchor: idaLado ? 'end' : 'start'});
    ajustarBadge(rB, tB, idaLado ? 'end' : 'start');
  });
}
// el badge delante del texto: si el navegador puede medir el glifo real (getComputedTextLength),
// recalcula el rect para que el texto blanco no sobresalga; en los stubs queda la estimación de wTxt
function ajustarBadge(rectEl, textEl, anchor){
  try {
    const wr = textEl.getComputedTextLength();
    if (!wr || !isFinite(wr)) return;
    const marg = 4;
    if (anchor === 'end') rectEl.setAttribute('x', -(wr + marg));
    else if (anchor === 'start') rectEl.setAttribute('x', -marg);
    else rectEl.setAttribute('x', -(wr/2 + marg));
    rectEl.setAttribute('width', wr + marg*2);
  } catch(_){}   // entorno sin medición (o módulo no layouteado): queda la estimación
}

/* ---------- Barra de tiempo ---------- */
/* ---------------- Pan lateral con mouse en #stage (desktop) ----------------
   En táctil el desplazamiento es nativo (overflow:auto). En desktop se agrega
   drag-to-scroll: arrastrar con el botón izquierdo mueve el contenido lateral
   (scrollLeft -= dx, el contenido sigue al cursor). Umbral de 4px para no
   romper el click de selección en los puntos. */
function engancharPanStage(){
  const stageEl = document.getElementById('stage');
  let down=false, x0=0, y0=0, moved=false;
  stageEl.addEventListener('mousedown', e=>{
    if (e.button !== 0) return;               // solo botón izquierdo
    down=true; x0=e.clientX; y0=e.clientY; moved=false;
    stageEl.style.cursor='grabbing';
    e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{
    if (!down) return;
    const dx=e.clientX-x0, dy=e.clientY-y0;
    if (Math.abs(dx)>4 || Math.abs(dy)>4) moved=true;
    stageEl.scrollLeft -= dx;
    stageEl.scrollTop  -= dy;
    x0=e.clientX; y0=e.clientY;
  });
  window.addEventListener('mouseup', ()=>{
    if (down) stageEl.style.cursor='';
    down=false;
  });
  // un drag real cancela el click subyacente (selección de punto)
  stageEl.addEventListener('click', e=>{
    if (moved){ e.stopPropagation(); e.preventDefault(); moved=false; }
  }, true);
}

/* ---------- Barra de tiempo T36: botón-hora central + tira que fluye de abajo hacia arriba ----------
   Cambia el concepto anterior (manija sobre una guía estática): la hora AHORA ES EL BOTÓN,
   siempre al centro de la guía, mostrando HH:MM:SS en tiempo real.
   · avance automático a velocidad real: 1 s de simulación por segundo de reloj (ancla rejuvenece
     con cada gesto, p.ej. tras un drag se retoma 1:1 DESDE esa hora);
   · la tira de marcas horarias corre por DETRÁS del botón: el futuro nace abajo, atraviesa el
     centro (ahora) y el pasado sale hacia arriba;
   · arrastre de la tira = scrub manual (arriba = avanzar, abajo = retroceder); al soltar el
     avance automático SE RETOMA desde la hora soltada;
   · toque único en el botón = pausa / reanudar; doble toque rápido = re-sincronizar con la HORA
     REAL del reloj de pared y seguir avanzando segundo a segundo desde ahí.
   Los consumidores de simT (puntos animados, panel pas/prox/fut) no cambian: simT sigue siendo
   minutos flotantes continuos (ahora con precisión de segundos). */
const TB = { pph: 72,            // píxeles por hora de la tira (1 s ≈ 0.02 px: flujo lento legible)
             pausa:false, t0:0, s0:0, timer:null, drag:null, lastTap:0, tapTimer:null, ultSeg:-1, dirty:false };

function setearAnclaje(sec, pausada){
  TB.s0 = clampSeg(sec); TB.t0 = Date.now(); TB.pausa = !!pausada;
  document.getElementById('btnHora').classList.toggle('pausa', TB.pausa);
}
function clampSeg(seg){ return Math.min(T_END*60, Math.max(T_START*60, seg)); }

// botón + tira (barato): se llama a cada latido (180 ms) aunque esté pausado
function refrescarTimebar(){
  document.getElementById('btnHora').textContent = hms(simT*60);
  const r = document.getElementById('slider').getBoundingClientRect();
  const cy = r.height/2, pps = TB.pph/3600, sec = simT*60;
  const base = Math.floor(sec/3600);
  const n = Math.ceil(cy/TB.pph) + 1;                    // marcas por arriba y por abajo del centro
  let html = '';
  for (let k=-n; k<=n; k++){
    const tSec = (base+k)*3600;                          // valor absoluto de la hora (puede pasar 24h)
    const y = cy + (tSec - sec)*pps;                     // t futuro → abajo; pasa por el centro y sale arriba
    if (y < -22 || y > r.height+22) continue;
    const hh = ((base+k)%24 + 24) % 24;
    html += `<div class="hh" style="top:${(y-7).toFixed(1)}px"><span></span>${String(hh).padStart(2,'0')}:00</div>`;
  }
  document.getElementById('tira').innerHTML = html;
}

function tickTimebar(){
  if (!TB.pausa && !TB.drag) simT = clampSeg(TB.s0 + (Date.now()-TB.t0)/1000) / 60;
  const seg = Math.floor(simT*60);
  if (seg !== TB.ultSeg || TB.dirty){ TB.ultSeg = seg; TB.dirty = false; render(simT); }
  refrescarTimebar();
}

function hms(seg){
  const h = Math.floor(seg/3600) % 24, m = Math.floor(seg/60) % 60, s = Math.floor(seg) % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// arrastre de la TIRA (no del botón): arriba = el tiempo corre hacia adelante
function engancharTimebarDrag(){
  const el = document.getElementById('slider');
  el.addEventListener('pointerdown', ev=>{
    if (ev.target.id === 'btnHora') return;              // el botón gobierna pausa/re-sincro, no el scrub
    TB.drag = { y0:ev.clientY, s0:simT*60 };
    try { el.setPointerCapture(ev.pointerId); } catch(_){}
    el.style.cursor = 'grabbing';
    ev.preventDefault();
  });
  window.addEventListener('pointermove', ev=>{
    if (!TB.drag) return;
    const dy = ev.clientY - TB.drag.y0;
    simT = clampSeg(TB.drag.s0 - dy/(TB.pph/3600)) / 60; // arrastre arriba (dy<0) ⇒ avanza
    setearAnclaje(simT*60, true);                        // durante el drag: ancla helada en la mano
    TB.dirty = true;
  });
  window.addEventListener('pointerup', ()=>{
    if (!TB.drag) return;
    TB.drag = null;
    document.getElementById('slider').style.cursor = 'grab';
    setearAnclaje(simT*60, false);                       // al soltar: retoma el avance 1:1 DESDE esa hora
  });
}

// gesto del BOTÓN-HORA: 1 toque = pausa/reanudar; 2 toques rápidos = hora real del reloj
function engancharBtnHora(){
  const b = document.getElementById('btnHora');
  b.addEventListener('click', ()=>{
    if (TB.tapTimer){ clearTimeout(TB.tapTimer); TB.tapTimer = null; }   // doble toque confirmado
    if (TB.lastTap && Date.now()-TB.lastTap < 350){
      TB.lastTap = 0;
      const d = new Date();
      setearAnclaje(d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds());   // avanza 1:1 desde AHORA real
    } else {
      TB.lastTap = Date.now();
      TB.tapTimer = setTimeout(()=>{
        TB.tapTimer = null; TB.lastTap = 0;
        setearAnclaje(simT*60, !TB.pausa);               // toque único: alterna pausa
      }, 370);
    }
  });
}

function initTimebar(){
  if (TB.timer) clearInterval(TB.timer);
  engancharTimebarDrag();
  engancharBtnHora();
  // arranque a la HORA REAL del acceso (recortada a la ventana operativa 04:00→01:00), avanzando 1:1
  const d = new Date();
  setearAnclaje(d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds());
  TB.timer = setInterval(tickTimebar, 180);
  tickTimebar();
}


/* ---------- Utilidades ---------- */
function fmt(min){ const m=((min%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function mk(parent, tag, attrs){ const el=document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]); parent.appendChild(el); return el; }
function txt(parent,x,y,s,o){ const t=mk(parent,'text',{x, y, 'text-anchor':o.anchor||'start',
  'font-size':o.size||10, 'font-weight':o.weight||400, fill:o.fill||'#000'}); t.textContent=s; return t; }
function rot(parent,x,y,s,deg,o){ const t = txt(parent,x,y,s,o);
  t.setAttribute('transform',`rotate(${deg} ${x} ${y})`); return t; }
function tossOld(id){ const o=document.getElementById(id); if (o) o.remove(); }

main().catch(err=>{
  document.body.insertAdjacentHTML('afterbegin',
    `<div style="background:#ffe9e9;color:#900;padding:12px;font-size:12px">
     Error: ${err.message} — serví la carpeta con <code>python3 -m http.server</code> y abrí <code>http://localhost:8080/index.html</code></div>`);
});
</script>
